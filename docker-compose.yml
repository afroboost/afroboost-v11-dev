version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # V229: ces deux variables sont consommees PENDANT `craco build` (Create
      # React App les inline dans le bundle), pas a l'execution — elles doivent
      # donc etre des build args et non des entrees de `environment:`.
      # Ni un secret ni l'autre : un upload preset « unsigned » est fait pour
      # etre expose au navigateur, et le cloud name apparait dans chaque URL
      # d'image livree. Les defauts rendent le build reproductible hors Coolify.
      args:
        REACT_APP_CLOUDINARY_CLOUD_NAME: ${REACT_APP_CLOUDINARY_CLOUD_NAME:-dtm0r7hwq}
        REACT_APP_CLOUDINARY_UPLOAD_PRESET: ${REACT_APP_CLOUDINARY_UPLOAD_PRESET:-afroboost}
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME:-afroboost_db}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # V223: secret de signature propre à l'endpoint /api/webhook/stripe.
      # Distinct de STRIPE_WEBHOOK_SECRET ci-dessus, qui appartient à
      # /api/stripe/webhook : Stripe émet un secret par endpoint.
      # Tant qu'il est vide, le webhook reste non authentifié (comportement
      # actuel) et un avertissement est journalisé à chaque appel.
      - STRIPE_WEBHOOK_SECRET_CHECKOUT=${STRIPE_WEBHOOK_SECRET_CHECKOUT:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-contact@afroboost.ch}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN:-}
      - META_WHATSAPP_PHONE_ID=${META_WHATSAPP_PHONE_ID:-}
      - META_WHATSAPP_VERIFY_TOKEN=${META_WHATSAPP_VERIFY_TOKEN:-afroboost_webhook_2024}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - CINETPAY_API_KEY=${CINETPAY_API_KEY:-}
      - CINETPAY_SITE_ID=${CINETPAY_SITE_ID:-}
    restart: unless-stopped
    # V320 — SONDE DE SANTÉ = condition de la bascule SANS COUPURE.
    # Sans elle, Coolify/Traefik ne sait pas quand le nouveau conteneur est prêt :
    # il route dessus trop tôt (ou retire l'ancien trop tôt) -> le visiteur reçoit
    # « 404 page not found » (page d'erreur de Traefik) pendant plusieurs secondes.
    #
    # Cible : /healthz — sonde PURE, sans MongoDB (cf. api/server.py). Utiliser
    # /health, qui ping Atlas, ferait passer le conteneur « unhealthy » au moindre
    # ralentissement de la base et le mettrait en boucle de redémarrage.
    #
    # `python -c` et non `curl` : l'image python:3.11-slim ne contient pas curl.
    # `start_period` : délai de grâce au démarrage (import de server.py + connexion
    # Mongo) pendant lequel un échec ne compte PAS comme une panne.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 40s
