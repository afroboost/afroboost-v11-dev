<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Afroboost</title>
  <style>
    /* V323 — Page de repli embarquee dans l'app.
       Elle ne s'affiche QUE si afroboost.com est injoignable au lancement.
       Volontairement minuscule : le contenu reel vient toujours du site en direct. */
    :root { --primary-color: #D91CD2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #000; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .wrap { max-width: 320px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.6); margin: 0 0 22px; }
    button {
      background: var(--primary-color); color: #fff; border: none;
      padding: 13px 26px; border-radius: 24px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Icone SVG inline (jamais d'emoji) -->
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
         stroke="var(--primary-color)" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
    <h1>Pas de connexion</h1>
    <p>Afroboost a besoin d'Internet pour afficher tes cours, tes réservations et ton chat. Vérifie ta connexion, puis réessaie.</p>
    <button onclick="location.replace('https://afroboost.com')">Réessayer</button>
  </div>
</body>
</html>
